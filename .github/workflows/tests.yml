name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test --reporter=junit --reporter-outfile=junit.xml
      - name: Test summary
        if: failure() && hashFiles('junit.xml') != ''
        uses: test-summary/action@v2.6
        with:
          paths: junit.xml
