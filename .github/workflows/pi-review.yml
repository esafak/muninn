name: Pi Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  review:
    if: >-
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                 github.event.comment.author_association) &&
        (startsWith(github.event.comment.body, '/pi-review') ||
         startsWith(github.event.comment.body, '/pi-summary')))) &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'pull_request_review_comment' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: review
    env:
      THINKING: ${{ vars.THINKING }}
    concurrency:
      group: pi-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: bot-token
        with:
          client-id: ${{ secrets.PI_REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.PI_REVIEWER_PK }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write
      - uses: esafak/pi-reviewer@b8c00291c4e9955b612ec2da967f1d79325cbabe
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          pi-api-key: ${{ secrets.PI_API_KEY }}
          model: ${{ vars.MODEL_NAME }}
          thinking: ${{ env.THINKING }}
